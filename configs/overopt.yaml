# Research milestone R1: exact overoptimization of a learned value model.
# Read by scripts/research/overopt_checks.py and scripts/research/overopt_curves.py.
# Plan: docs/plans/fellowship_research_directions.md (sections 4 to 7); notes:
# docs/notes/overopt.md. Everything is exact for the fitted game MDP (data/mdp), not real
# football. Synthetic games come from the solved MDP's simulator; no play-by-play is
# loaded, so no season (2024, 2025 or 2026) is touched.

seed: 20261122

# Who makes the decisions after a play (timeouts, the try after a touchdown), in the
# synthetic games, in the exact evaluator and in every Monte Carlo check: the simulator's
# coach rules (mdp_game.Solution, post="coach"). The pilot used the model's own choices.
post: coach

# Optimization pressure of the tilted policy pi_beta(a | s) ~ coach(a | s) exp(beta Q(s, a)).
betas: [10, 30, 100, 300, 1000, 10000]

# Ties between actions in argmax diagnostics and the best response (policy_eval.greedy):
# "uniform" spreads the mass over every action within `atol` of the best; "exclude" drops
# states with a tie from the diagnostics.
ties: {rule: uniform, atol: 0.0}

work_dir: data/research/overopt   # synthetic games and proxy models (gitignored)

# Synthetic coach-vs-coach games: every pre-snap state, labelled with the final result
# for the team with the ball. Seeds 101, 116 and 999 are the pilot's.
games:
  val:    {n: 4000,  seed: 999}
  g1k_a:  {n: 1000,  seed: 101}
  g1k_b:  {n: 1000,  seed: 102}
  g1k_c:  {n: 1000,  seed: 103}
  g16k_a: {n: 16000, seed: 116}

# LightGBM win-probability proxies (cross-entropy on 0 / 0.5 / 1 labels), the pilot's
# settings. Without bagging or feature subsampling LightGBM is deterministic, so
# random_state changes nothing; the seed of a proxy is the seed of its games.
proxy_sizes:
  small: {num_leaves: 8, n_estimators: 100, learning_rate: 0.1, min_child_samples: 50}
  large: {num_leaves: 64, n_estimators: 150, learning_rate: 0.1, min_child_samples: 5}
proxy_random_state: 7
proxy_threads: 4
threads: 3          # pairs stepped in parallel within a tick, and forward passes at once

# Cells of the Day 5 curves. "oracle" is the exact coach value (no proxy error).
cells:
  oracle:      {proxy: oracle}
  16k_large:   {proxy: large, games: g16k_a}
  16k_small:   {proxy: small, games: g16k_a}
  1k_small:    {proxy: small, games: g1k_a}
  1k_large:    {proxy: large, games: g1k_a}
  1k_small_b:  {proxy: small, games: g1k_b}
  1k_large_b:  {proxy: large, games: g1k_b}
  1k_small_c:  {proxy: small, games: g1k_c}
  1k_large_c:  {proxy: large, games: g1k_c}

checks:
  # Day 2: exact coach-vs-coach values against Monte Carlo from the simulator.
  post_mc: {n_states: 24, games_per_state: 62500, seed: 20261123, recheck_states: 6}
  # Day 3: the grid predictor against Booster.predict on every tick.
  grid: {cell: 1k_large}
  # Day 4: exact sequence KL against Monte Carlo KL at two pilot cells.
  kl_mc: {cells: [oracle, 1k_large], games: 20000, seed: 2027}
  # Day 5: one large Monte Carlo check of the exact win probability.
  large_mc: {cells: [1k_large], betas: [100, 10000], games: 200000, seed: 2028}

# Day 6, run A: the seeded grid (scripts/research/overopt_grid.py and
# notebooks/overopt_grid_colab.ipynb). A cell is (games, capacity, seed); its key is
# n<games>_<capacity>_s<seed>, for example n250_large_s101. The seed is the seed of the
# synthetic training games (the proxy's only source of randomness, as on day 5), so
# n1000_<capacity>_s101 to s103 use the same games as day 5's 1k_<capacity>, _b and _c.
grid:
  # Priority blocks, run in this order: the turnover region first, so a short session still
  # yields the most informative cells. Within a block the order is seed, then games, then
  # capacity, so every finished prefix holds whole replicates.
  blocks:
    - [250, 500, 1000]
    - [4000, 16000]
    - [64000]
  capacities: [small, large]      # proxy_sizes above: 8 and 64 leaves
  seeds: [101, 102, 103, 104, 105]
  # The oracle cell (exact coach values, no proxy) gives the reference curve and the best
  # response; it is planned after this block (0 = after the first block, null = not at all).
  oracle_after_block: 0
  val_games: val                  # the validation games of `games` above (4,000, seed 999)
  results_dir: results/research/overopt_grid/cells
  # Resources per cell, from the day 5 passes on this machine (3 threads): 718 to 947 s and
  # 7.06 to 7.64 GB peak. The parallelism rule keeps reserve_gb free for the system.
  mem_gb_per_cell: 8.0
  reserve_gb: 2.0
  threads_per_cell: 3
  seconds_per_cell: 1000          # starting estimate for the deadline guard (measured later)
  # The local data/mdp's identity (overopt_grid.game_key of its meta.json). A game rebuilt
  # from a fresh download usually differs (nflverse revises its data), and collect never
  # pools cells from different games.
  reference_game_key: ea0c61dd52ab0fe7
