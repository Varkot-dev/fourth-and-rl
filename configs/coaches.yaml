# M7 coach evaluation and the coach cost ledger. Read by fourth_and_rl.coaches.load_config.
# Seasons come from configs/splits.yaml; every other constant that shapes a result is here.
seed: 20261117
n_threads: 3                  # LightGBM threads for the fold refits (machine is shared)

# Which real fourth downs are graded. 2010 is a development season but is not graded:
# the coach table and the team-strength ratings (M8) start in 2011.
grade_seasons: [2011, 2025]

# Leave-seasons-out folds over the development seasons. Each fold's seasons are graded by
# a win-probability model (version 2 spec, no calibration map) and a play-outcome bundle
# fitted on the OTHER development seasons only. The test seasons are graded by the
# headline models (fitted on every development season), and never enter any fold fit.
folds:
  # Two consecutive seasons per fold (2010-11, ..., 2022-23), as in the win-probability
  # cross-fit (configs/wp.yaml). A first run used four (2010-13, ..., 2022-23); it was
  # replaced because the play-outcome count tables use 2018 onward only, so the 2018-21
  # fold's tables came from two seasons and the league trend jumped at fold boundaries.
  fold_size: 2
  models_dir: data/models/coaches   # fold models and replicates (not committed)

# Bootstrap categories. Test seasons reuse the 101-replicate M3 categories
# (data/processed/fourth_down_decisions.parquet). Development seasons get a cheaper
# game-level bootstrap inside each fold: the fold's fit seasons are resampled by whole
# games and both models refitted, n_boot times.
bootstrap:
  n_boot: 31
  thresholds: {confident: 0.83, lean: 0.67}   # the M3 rule (Brill, Yurko and Wyner)

# Intervals and shrinkage for the coach and team tables.
tables:
  n_boot: 2000                # game-bootstrap draws for every interval in the tables
  interval: [0.05, 0.95]      # 90% intervals
  min_games: 32               # coaches with fewer graded games are left out of the ranking
  games_per_season: 17        # costs are shown per 17 games (one regular season) as well
  team_window: [2021, 2025]   # the team aggressiveness figure: the last five seasons
  n_shown: 12                 # coaches shown at each end of the ledger figure

# The coach cost ledger: penalties the owner assigns to the head coach (his assumption,
# tested in the assumption-test section before it is used).
penalties:
  cache_dir: data/m7_penalties          # raw nflverse penalty columns, one file per season
  coach_types: ["False Start", "Delay of Game"]
  # Recorded so the exclusion is explicit; these are never assigned to the coach.
  not_coach_types: ["Encroachment", "Defensive Offside", "Neutral Zone Infraction"]
  # Delay of game counted as deliberate (excluded): the offense was lined up to punt or
  # kick ("Punt formation" or "Field Goal formation" in the play description), or the foul
  # came on fourth down and the offense's next snap was a punt or field-goal attempt.
  deliberate_formations: ["Punt formation", "Field Goal formation"]
  # Situations for the assumption test's model.
  long_distance: 7            # "third or fourth and long" means at least this many yards
  # Variance-component model of the coach's share (Poisson, crossed random effects,
  # Laplace approximation). Starting log-variances for the optimizer.
  mixed_model:
    start_log_var: -3.0
    # Profile grid for the coach standard deviation (log variances); the bottom value
    # (sd 0.007) stands for "no coach effect".
    profile_log_var: [-10.0, -7.0, -6.0, -5.0, -4.5, -4.0, -3.5, -3.0, -2.5, -2.0, -1.5]
  # The rule for using the assumption, written down before the penalty data was read.
  # Penalties go into the coach's ledger total only if all three hold; otherwise they are
  # reported in a separate column with the statement that assigning them is not supported.
  #   1. the 95% profile interval of the coach standard deviation excludes the grid bottom
  #   2. the coach's share of the systematic variance (coach + franchise + team-season)
  #      is at least min_coach_share
  #   3. the rate follows the coach: the correlation for coaches who moved is at least
  #      as large as for teams that changed coach
  verdict: {min_coach_share: 0.33}

# Exact game solution (M4) is read for the malpractice cases where the clock matters.
exact_solution: true

# The case study (plan section 5): Lions at 49ers, NFC Championship (2023 season).
case_study:
  game_id: 2023_21_DET_SF
  team: DET

# Malpractice check, part one: the cases from research-kit/x/2_twitter_findings.md
# (sections 1, 8.7 and 9.2) that happened before the 2026 season. Each was located by hand
# in the play-by-play (game, team, clock, distance) and is pinned here by play id; where a
# post does not say which play it means, every candidate play of that kind is scored. The
# outrage column quotes the label used on X (unverified posts, see that file's rules).
# 2026 cases are pending the final holdout evaluation.
malpractice:
