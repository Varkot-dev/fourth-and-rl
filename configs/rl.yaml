# M5: reinforcement-learning agents against the exact optimum. Read by scripts/rl_tabular.py
# and scripts/rl_deep.py. Every budget, seed and hyperparameter of the milestone lives here.

# The solved model the environments are built from. A frozen copy, so other work that
# re-solves data/mdp/ cannot change these results mid-run. Point it at data/mdp to rerun on
# the current solution; its meta.json is copied into the results.
snapshot_dir: data/rl_snapshot/mdp
runs_dir: data/rl/runs            # per-run results (resumable: finished runs are skipped)
models_dir: data/models/rl        # trained networks (gitignored)
loss_table: data/rl/loss_table_end.npy   # V* - Q* for every end-game state and action
workers: 2                        # parallel processes (the machine is shared)

drive:
  # Where a drive starts: half the time after a kickoff (the model's kickoff distribution),
  # half the time at a uniform yard line (drives after punts and turnovers start anywhere).
  kickoff_share: 0.5
  thresholds: [0.05, 0.01]        # expected points: sample efficiency is measured at these
  n_checkpoints: 30

endgame:
  start:                          # start-state distribution (rl.envs.StartSpec)
    seconds_min: 30
    seconds_max: 300
    score_abs_max: 8
    p_first_and_10: 0.7
    max_distance: 15
  eval_games: 4000                # fixed start states, the same for every agent and checkpoint
  eval_seed: 20261201
  thresholds: [0.01, 0.002]       # win probability (1 and 0.2 points)
  n_checkpoints: 14

tabular:
  seeds: [101, 102, 103, 104, 105]
  n_steps: 6000000                # fourth-down decisions per run
  # Default schedules (rl.tabular.Schedule). Chosen before looking at results from the
  # usual textbook ranges, then varied one at a time in the ablations below.
  schedule:
    eps_kind: linear
    eps_start: 1.0
    eps_end: 0.05
    eps_decay_frac: 0.5
    alpha_kind: count
    alpha0: 1.0
    omega: 0.7
    alpha_min: 0.0
  optimistic:
    q_init: 8.0                   # above any return in points (a touchdown is worth 6.95)
    schedule: {eps_kind: constant, eps_start: 0.0, alpha_kind: constant, alpha0: 0.05}
  reinforce:
    lr: 0.05
    baseline_lr: 0.05
  ablation_seeds: [201, 202, 203]
  ablation_steps: 3000000
  ablations:
    exploration:
      linear_decay: {}
      constant_0.1: {eps_kind: constant, eps_start: 0.1}
      constant_0.5: {eps_kind: constant, eps_start: 0.5}
      greedy_zero_init: {eps_kind: constant, eps_start: 0.0}
    step_size:
      count_omega_0.7: {}
      count_omega_1.0: {omega: 1.0}
      count_omega_0.5: {omega: 0.5}
      constant_0.05: {alpha_kind: constant, alpha0: 0.05}
      constant_0.005: {alpha_kind: constant, alpha0: 0.005}
    optimistic:
      optimistic_greedy_const_alpha: {q_init: 8.0, eps_kind: constant, eps_start: 0.0, alpha_kind: constant, alpha0: 0.05}
      optimistic_greedy_count_alpha: {q_init: 8.0, eps_kind: constant, eps_start: 0.0}
    reinforce_lr:
      lr_0.02: {lr: 0.02}
      lr_0.05: {lr: 0.05}
      lr_0.2: {lr: 0.2}
  gradient_variance_episodes: 100000

deep:
  seeds: [301, 302, 303]
  torch_threads: 1
  reinforce_net:
    n_steps: 3000000
    hidden: 64
    lr: 0.003
    baseline_lr: 0.003
    episodes_per_update: 1024
  drive:                          # SB3 on the drive (features: yard line, distance, distance bin)
    n_envs: 64
    dqn_steps: 400000
    ppo_steps: 800000
  endgame:
    n_envs: 64
    dqn_steps: 800000
    ppo_steps: 1200000
  dqn:
    learning_rate: 0.0005
    buffer_size: 200000
    learning_starts: 5000
    batch_size: 256
    gamma: 1.0                    # episodic, no discount (as the DP)
    train_freq: 1                 # one vector step = n_envs transitions
    gradient_steps: 4
    target_update_interval: 2000
    exploration_fraction: 0.3
    exploration_final_eps: 0.05
    net_arch: [128, 128]
  ppo:
    learning_rate: 0.0003
    n_steps: 256                  # per environment: 256 x 64 = 16,384 transitions per update
    batch_size: 2048
    n_epochs: 4
    gamma: 1.0
    gae_lambda: 0.95
    clip_range: 0.2
    ent_coef: 0.01
    net_arch: [128, 128]
  sparsity:                       # reward sparsity ablation on the end game (DQN)
    seeds: [311, 312]
    steps: 400000
    shaping: [none, score, value]
  coach_opponent:                 # second opponent variant (DQN, evaluated by win rate)
    seeds: [321]
    steps: 800000
  approximation:                  # function approximation floor: fit Q* directly
    drive_epochs: 3000
    endgame_states: 400000
    endgame_epochs: 30
    seed: 331
