# M4: the Markov decision process and its exact solution. Read by fourth_and_rl.mdp.load_config.
# Every constant of the model lives here. Numbers marked "measured" come from
# results/research/endgame_clock_stats_dev.json: the end-game research statistics computed
# on DEVELOPMENT seasons only (scripts/research/endgame_clock_stats.py --dev-only), so the
# game model holds nothing from the test seasons. tests/test_mdp.py checks that the values
# below equal that file. The all-seasons research record (endgame_clock_stats.json, see
# docs/research/endgame_clock.md) is descriptive and is not used by the model.

seed: 20261117

grid:
  dist_exact: 10                 # yards to go 1..10 are exact states
  dist_bins:                     # then bins: [first, last, representative distance]
    - [11, 15, 13]
    - [16, 99, 20]

score_max: 21                    # score differential is clipped to -21..+21

scoring:
  touchdown: 6
  field_goal: 3
  safety: 2
  two_point_choice: true         # after a touchdown the scoring team takes the better of the
                                 # kick and the two-point try (probabilities from the M1 bundle)

clock:
  tick_seconds: 5                # one time step
  game_seconds: 3600
  half_seconds: 1800
  endgame_seconds: 300           # last 5:00: timeouts and tempo are in the state
  warning_seconds: 120           # two-minute warning (second half only in this model)
  burn_runoff_ticks: 8           # an in-bounds play by an offense burning clock: 1 tick + 8
  punt_ticks: 2
  max_play_ticks: 10             # empirical play-length histograms cover 1..10 ticks
  n_timeouts: 3
  kneel_seconds: 2               # measured: seconds a kneel itself takes (n = 159)
  play_clock_seconds: 40
  # measured (section 2.2): timeouts held at the first snap inside 5:00 of a one-score game,
  # for 0, 1, 2, 3 timeouts. Used to enter the end game from the coarser early-game model.
  # Each set sums to exactly 1 (largest-remainder rounding in the research script).
  timeout_shares_trailing: [0.063, 0.097, 0.304, 0.536]
  timeout_shares_leading: [0.031, 0.140, 0.347, 0.482]
  # "optimal": the defense takes a timeout after an in-bounds play exactly when that lowers the
  # offense's win probability. "empirical": it takes one with the measured rates below when the
  # offense leads, and never otherwise.
  defense_timeout: optimal
  # measured (section 2.2), by timeouts the defense holds (0, 1, 2, 3)
  defense_timeout_rate_before_warning: [0.0, 0.669, 0.555, 0.412]
  defense_timeout_rate_after_warning: [0.0, 0.802, 0.933, 0.929]

tables:                          # small count tables fitted from DEVELOPMENT seasons only
  first_season: 2018             # (the fits refuse test seasons, so the last season used is
                                 # the last development season of configs/splits.yaml)
  gain_bucket_edges: [-99, 0, 1, 4, 8, 15]   # lower edges of the yards-gained buckets
  one_score: 8                   # "protect" = leading by 1..8, "chase" = trailing by 1..8
  calibrate_modes: true          # false: protect and chase use the generic play's yards and turnovers
  chase_exclude_last_seconds: 30 # desperation plays left out of the chase calibration
  max_elapsed_seconds: 60        # larger snap-to-snap gaps are timestamp errors

actions:
  field_goal_any_down: true      # a field goal may be tried on any down (end of half or game)
  kneel: true

sensitivity:                     # all zero in the base model; scripts override them
  go_convert_shift: 0.0          # added to the fourth-down conversion probability
  chase_gain_tilt: 0.0           # added to the fitted chase tilt: weight exp(tilt * yards)

drive:                           # stage 1, the single-drive expected-points problem
  tolerance: 1.0e-10
  max_iterations: 5000
  coach_first_season: 2018

coach:                           # observed fourth-down behavior, for the coach-like simulator policy
  first_season: 2018
  prior_strength: 10.0           # pseudo-counts pulling a thin cell toward its parent cell
  end_fg_max_yardline: 42        # coach heuristic: longest field goal tried as time expires
  end_fg_ticks: 2                # ... when this many ticks or fewer remain

solve:
  dtype: float32
  output_dir: data/mdp

monte_carlo:                     # DP value against simulated win frequency
  n_states: 60
  games_per_state: 4000
  seed: 20261118

validation:
  # Real comparison targets: the test seasons (out of sample, the headline) and the
  # development seasons from in_sample_first_season on (in sample, labelled as such).
  in_sample_first_season: 2021
  n_games: 40000
  seed: 20261119
  checkpoints_seconds: [2700, 1800, 900, 600, 300, 120]
  lead_bins: [[1, 3], [4, 8], [9, 16], [17, 99]]

question1:
  seconds: [120, 180, 240, 300]
  leads: [1, 3, 4, 7]
  yardlines: [50, 80]            # yardline_100 from midfield (50) to the own 20 (80)
  distances: [1, 10]
  offense_timeouts: 3
  headline: {lead: 4, seconds: 240, ydstogo: 2, yardline_100: 60, defense_timeouts: 3}
  decomposition_games: 200000
  sensitivity_games: 50000
  seed: 20261120
  convert_shifts: [-0.05, 0.05]
  chase_tilts: [-0.02, -0.01, 0.01, 0.02]
