[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fourth-and-rl"
version = "0.1.0"
description = "NFL fourth-down decisions as a sequential decision problem: win-probability models, dynamic programming and reinforcement learning."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "nflreadpy>=0.1.5",
    "polars>=1.0",
    "pyarrow>=15",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "lightgbm>=4.0",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "joblib>=1.3",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
rl = ["gymnasium>=1.0", "torch>=2.2", "stable-baselines3>=2.3", "d3rlpy>=2.5"]
app = ["plotly>=5.20", "streamlit>=1.50"]
# GPU end-phase solver (src/fourth_and_rl/mdp_team_jax.py). This pulls the CPU build; on a
# GPU machine install jax[cuda12] (Colab already has it, and the extra keeps it).
jax = ["jax>=0.4.30"]

[tool.hatch.build.targets.wheel]
packages = ["src/fourth_and_rl"]

[tool.ruff]
line-length = 100
# Generated notebooks are checked by running them, not by the linter.
extend-exclude = ["notebooks/*.ipynb", "research/fellowship_pilots"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["data: needs the cached play-by-play data (skipped when it is absent)"]
